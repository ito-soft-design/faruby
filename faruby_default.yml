# faRuby - 既定設定
#
# このファイルは編集しないでください。
# 環境ごとの設定は faruby.yml に書きます。faruby.yml に無い項目は
# このファイルの値が使われます (ネストしたキーは個別に解決されます)。
#
#   faruby_default.yml  既定値の定義        (リポジトリに含む)
#   faruby.yml          利用者の設定・差分  (git 管理外)

plc:
  protocol: keyence_kv

  # いま相手にしている機種。
  #
  # コンソールと `rake transfer` がこの機種の設定を使います。
  # 生成 (`rake vm_core`) は機種を選ばず、全機種ぶんまとめて出します。
  # 使える名前は plc/keyence の下のフォルダ名と同じです。
  model: KV-5000

  # host と port は環境ごとに異なるため既定値を持ちません。
  # faruby.yml で必ず指定してください。
  host:
  port: 8501

mrbc:
  # 未指定の場合はよくある場所を自動探索します。
  path:

vm:
  # 1スキャンあたりに実行する命令数。
  # 大きくするとプログラムは速く進みますが、スキャンタイムが延びます。
  steps_per_cycle: 50

# --- メモリ配置 ---
#
# faRuby が使用する PLC デバイスの領域を指定します。
# ラダーが使用していない領域を割り当ててください。重なると双方が壊れます。
#
# 変更した場合は `rake vm_core` で vm_core.kvs を再生成し、
# KV Studio に取り込んで PLC へ転送し直す必要があります。
# アドレスは生成されたスクリプトに定数として焼き込まれるためです。
memory:
  # 使用するデバイス種別
  device: EM

  # faRuby が使用する領域の先頭アドレス
  #
  # 対象機 (KV-5000) でラダー側が faRuby 用に確保した範囲は
  # EM20000 - EM39999 (20000 ワード)。1インスタンス 2000 ワードなので
  # 10 インスタンスまで置ける。
  #
  #   faRuby 用に確保  EM20000 - EM39999
  #   インスタンス0    EM20000 - EM21999
  #   インスタンス1    EM22000 - EM23999   (instances: 2 以上で使用)
  #
  # 1インスタンスの大きさは下の max_* から決まります。増やすと
  # 置けるインスタンス数が減ります。コンソールの `memmap` で確認できます。
  #
  # 注意: EM は初期化されないため、読み取って 0 でも未使用とは限らず、
  # 非ゼロでも使用中とは限らない。配置はラダーのデバイス割り付けで
  # 判断すること。別の設備に導入する際は faruby.yml で上書きする。
  #
  # EM は CPU 側で割り付けておく必要がある (PLC 1 台ごとの設定)。
  # KV Studio の「CPU システム設定 → ローカル全体割付設定」で、EM の
  # ローカルデバイス予約個数を 25535 にして EM0-EM39999 まで使えるようにする。
  # 足りないまま実行すると「間接指定が不適切」の演算エラーで止まる。
  base: 20000

  # 同時に実行する faRuby インスタンスの数
  #
  # インスタンスごとに下記サイズ分の領域を占有し、それぞれが別の Ruby
  # プログラムを並行して実行します。操作対象はコンソールの `instance`
  # コマンドで切り替えます。
  #
  # 生成される KV スクリプトはこの数だけブロックを巡回します。命令本体は
  # 1つだけで、ブロック先頭を Z9 に載せ替えて使い回すため、数を増やしても
  # スクリプトは大きくなりません。停止中のインスタンスは STATUS の判定で
  # 空振りするだけです。
  #
  # 対象機では EM20000-EM39999 に 10 個まで置けます。既定を 2 にしてある
  # のは、並行実行を使えるようにしつつ残りを空けておくためです。
  # 変更したら `rake vm_core` で再生成して取り込み直してください。
  instances: 2

  # 1インスタンスが占有するワード数をこの倍数に切り上げます。
  # 開始・終了アドレスが区切りの良い値になり、複数インスタンスの場合も
  # 各ブロックが丸い境界に載ります。1 にすると切り上げません。
  align: 1000

  # --- 固定領域 (FM) ---
  #
  # 実行中に変わらないもの (バイトコード・定数プール・シンボル表・IREPテーブル)
  # は FM に置きます。FM は ZF をバンクに分けたもので、1 バンク 32768 ワード、
  # n = 0-3 です。faRuby はバンク 3 を使います。
  #
  # スクリプトは FRSET(3) でバンクを選んでから FM で触り、抜けるときに
  # FRSET(0) に戻します。現在のバンクを読む命令が無いため、Z レジスタのように
  # 退避して戻すことができないからです。
  #
  # ホストにはバンクを選ぶ手段が無いので ZF の絶対アドレスで触ります。
  # バンク 3 の FM0 は ZF98304 です。
  fixed_base: 0
  fixed_align: 1000

  # 1インスタンスあたりの容量
  #
  # バイトコード・定数プール・シンボル表は **全 irep の合計**です。
  # メソッドを定義すると本体が子 irep になり、同じ領域を分け合います。
  max_regs: 80         # VM レジスタ数        (1個あたり4ワード)
  max_bytecode: 3000   # バイトコード長       (1バイトあたり1ワード)
  max_pool: 150        # 定数プールのエントリ数 (1個あたり4ワード)
  max_symbols: 100     # シンボルの数          (1個あたり4ワード)
  max_globals: 100     # 汎用グローバル変数の数 (1個あたり4ワード)
  max_ireps: 16        # irep の数            (1個あたり8ワード)
  max_frames: 16       # 呼び出しの深さ        (1段あたり10ワード)
  max_methods: 64      # 名前 (メソッド名とシンボル) の数 (1個あたり1ワード)

  # --- 配列プール ---
  #
  # 配列の実体を置く固定数のスロットです。**順に渡して返しません。**
  # 使い切ると「配列の領域が足りない」で停止します。
  #
  # 回収 (GC) を持たないのは、PLC でメモリを動的に確保するのが
  # 望ましくないためです。ループの中で配列を作り続ける書き方は
  # いずれ止まります。確保はループの外に出してください。
  #
  #   a = []            ループの外で 1 スロット
  #   10.times { a << i }   確保は起きない
  #
  # 全スロットが同じ容量です。1スロット = 2 + max_array_len × 4 ワード。
  # 既定では 16 × (2 + 48) = 800 ワードを占めます。
  max_arrays: 16       # 同時に存在できる配列の数
  max_array_len: 12    # 1つの配列に入る要素数 (1要素あたり4ワード)

# --- 機種ごとの設定 ---
#
# 上の共通設定を機種ごとに上書きします。**書いた項目だけが差し替わります。**
# 見出しは機種名で、plc/keyence の下のフォルダ名と同じです。
#
#   models:
#     KV-X500:
#       plc:
#         host: 10.0.1.202   この機種のときだけ差し替わる
#       memory:
#         base: 24000
#
# どの機種を相手にしているかは plc.model で選びます。生成 (`rake vm_core`)
# は選ばず全機種ぶん出すので、機種ごとのメモリ配置はそれぞれの生成物に
# 焼き込まれます。
#
# **綴り方 (KV スクリプト / ST) と書き出し先はここでは決めません。**
# 機種に付いて回るもので、設定で選ぶ余地が無いためです
# (tools/dialect.rb)。
#
# 既定では機種による違いはありません。EM の割り付け (上の base を参照) は
# どちらの機種でも同じ手順で、PLC 本体側の設定です。
models:
  KV-5000:
  KV-X500:
