# faRuby - 既定設定
#
# このファイルは編集しないでください。
# 環境ごとの設定は faruby.yml に書きます。faruby.yml に無い項目は
# このファイルの値が使われます (ネストしたキーは個別に解決されます)。
#
#   faruby_default.yml  既定値の定義        (リポジトリに含む)
#   faruby.yml          利用者の設定・差分  (git 管理外)

plc:
  protocol: keyence_kv
  # host と port は環境ごとに異なるため既定値を持ちません。
  # faruby.yml で必ず指定してください。
  host:
  port: 8501

mrbc:
  # 未指定の場合はよくある場所を自動探索します。
  path:

vm:
  # 1スキャンあたりに実行する命令数。
  # 大きくするとプログラムは速く進みますが、スキャンタイムが延びます。
  steps_per_cycle: 50

# --- メモリ配置 ---
#
# faRuby が使用する PLC デバイスの領域を指定します。
# ラダーが使用していない領域を割り当ててください。重なると双方が壊れます。
#
# 変更した場合は `rake vm_core` で vm_core.kvs を再生成し、
# KV Studio に取り込んで PLC へ転送し直す必要があります。
# アドレスは生成されたスクリプトに定数として焼き込まれるためです。
memory:
  # 使用するデバイス種別
  device: EM

  # faRuby が使用する領域の先頭アドレス
  #
  # 現在の対象機 (KV-5000) は EM0-EM65535 の 65536 点。
  # 後ろ 45000 点 (EM20536 以降) がラダーのローカル変数に割り当て済みで、
  # faRuby が使えるのは EM20534 まで。
  #
  #   faRuby        EM15000 - EM19999   (5000 ワード)
  #   ローカル変数   EM20536 -
  #
  # 注意: EM は初期化されないため、読み取って 0 でも未使用とは限らず、
  # 非ゼロでも使用中とは限らない。配置はラダーのデバイス割り付けで
  # 判断すること。別の設備に導入する際は faruby.yml で上書きする。
  base: 15000

  # 同時に実行する faRuby インスタンスの数
  # インスタンスごとに下記サイズ分の領域を占有します
  instances: 1

  # 1インスタンスが占有するワード数をこの倍数に切り上げます。
  # 開始・終了アドレスが区切りの良い値になり、複数インスタンスの場合も
  # 各ブロックが丸い境界に載ります。1 にすると切り上げません。
  align: 1000

  # 1インスタンスあたりの容量
  max_regs: 80         # VM レジスタ数        (1個あたり4ワード)
  max_bytecode: 3000   # バイトコード長       (1バイトあたり1ワード)
  max_pool: 200        # 定数プールのエントリ数 (1個あたり4ワード)
  max_symbols: 100     # グローバル変数の数    (1個あたり4ワード)
  max_globals: 100     # 汎用グローバル変数の数 (1個あたり4ワード)
